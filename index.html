<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing AI Companion</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: 'Google Sans Text', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .prose-music h3 {
      font-weight: 700;
      font-size: 1rem;
      color: #1f1f1f;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-left: 3px solid #0284c7;
      padding-left: 0.5rem;
      letter-spacing: -0.01em;
    }
    .prose-music h3:first-child {
      margin-top: 0.5rem;
    }
    .dark .prose-music h3 {
      color: #e3e3e3;
    }

    .prose-music p {
      color: #1f1f1f;
      font-size: 0.9375rem;
      line-height: 1.85;
      margin-top: 0;
      margin-bottom: 0;
      text-indent: 1em;
      letter-spacing: 0.01em;
    }
    .dark .prose-music p {
      color: #c4c7c5;
    }
    .prose-music strong, .prose-music b {
      font-weight: 700;
      color: #0b57d0;
    }
    .dark .prose-music strong, .dark .prose-music b {
      color: #a8c7fa;
    }
  </style>
</head>
<body class="bg-white dark:bg-slate-900 text-[#1f1f1f] dark:text-[#e3e3e3] min-h-screen flex flex-col selection:bg-sky-500/20">

  <header class="border-b border-slate-200/70 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur sticky top-0 z-40 px-5 py-2.5 flex items-center justify-between">
    <div id="btn-brand-settings" class="flex items-center gap-2 cursor-pointer select-none group" title="Gemini API設定">
      <div class="h-6 w-6 rounded-md bg-sky-600 flex items-center justify-center text-white shadow-sm group-hover:bg-sky-500 transition">
        <i data-lucide="music-2" class="h-3.5 w-3.5"></i>
      </div>
      <span class="font-bold text-xs tracking-tight text-slate-700 dark:text-slate-300">Now Playing</span>
      <span id="api-key-indicator-dot" class="w-1.5 h-1.5 rounded-full bg-amber-500 hidden" title="APIキー未設定"></span>
    </div>

    <div class="flex items-center gap-2">
      <!-- ワンクリック 曲情報 共有/コピーボタン -->
      <button id="btn-copy-track-header" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 text-xs font-medium transition shadow-sm" title="曲情報を共有またはコピー">
        <i data-lucide="share-2" class="h-3.5 w-3.5 text-slate-600 dark:text-slate-300"></i>
        <span id="btn-copy-track-text">曲情報</span>
      </button>

      <!-- 表示切り替えボタン（ミニマム / 標準） -->
      <button id="btn-toggle-compact" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 text-xs font-medium transition shadow-sm">
        <i data-lucide="minimize-2" class="h-3.5 w-3.5 text-sky-600"></i>
        <span>ミニマム</span>
      </button>
    </div>
  </header>

  <!-- 受信ステータス/デバッグ用トースト -->
  <div id="share-debug-banner" class="hidden bg-sky-50 dark:bg-sky-950/60 border-b border-sky-100 dark:border-sky-900 px-4 py-2 text-[11px] text-sky-700 dark:text-sky-300 flex items-center justify-between">
    <span id="share-debug-text" class="truncate">共有データを受信しました</span>
    <button onclick="this.parentElement.classList.add('hidden')" class="ml-2 text-sky-500 hover:text-sky-700">✕</button>
  </div>

  <!-- ミニマム表示 -->
  <main id="compact-view" class="flex-1 max-w-2xl w-full mx-auto px-6 py-8 flex flex-col gap-6 bg-white dark:bg-slate-900 hidden">
    <div class="flex flex-col sm:flex-row items-center sm:items-end gap-6 pb-6 border-b border-slate-100 dark:border-slate-800">
      <div class="w-40 h-40 flex-shrink-0 bg-slate-50 dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-center relative overflow-hidden">
        <img id="compact-artwork-img" src="" alt="Artwork" referrerpolicy="no-referrer" class="w-full h-full object-cover hidden">
        <div id="compact-artwork-fallback" class="text-slate-400 flex flex-col items-center">
          <i data-lucide="disc-3" class="h-10 w-10 mb-1 opacity-40"></i>
          <span class="text-[11px] font-mono">No Image</span>
        </div>
      </div>

      <div class="text-center sm:text-left flex-1 min-w-0">
        <div class="mb-1 min-h-[22px] flex items-center gap-2">
          <span id="compact-mode-badge" class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 hidden">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
            アルバムモード
          </span>
          <span id="compact-session-badge" class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full font-medium bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 hidden">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            自動追従中
          </span>
        </div>
        <h2 id="compact-title" class="text-xl md:text-2xl font-bold text-[#1f1f1f] dark:text-white tracking-tight leading-tight break-words">待機中</h2>
        <p id="compact-artist" class="text-xs font-medium text-slate-600 dark:text-slate-300 mt-1.5">音楽を再生してください</p>
        <p id="compact-album" class="text-xs text-slate-400 dark:text-slate-500 mt-0.5"></p>
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between gap-2 pb-4 mb-2 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <button id="compact-btn-start-session" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
            <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
            <span>ライナーノーツ開始</span>
          </button>
          <button id="compact-btn-stop-session" class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-750 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 text-xs font-semibold shadow-sm transition hidden flex items-center gap-1.5">
            <i data-lucide="square" class="h-3 w-3 fill-current"></i>
            <span>これでおしまい</span>
          </button>
        </div>
        <button id="compact-btn-copy-notes" class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 transition flex items-center gap-1 hidden">
          <i data-lucide="share-2" class="h-3.5 w-3.5"></i>
          <span>解説を共有</span>
        </button>
      </div>

      <div id="compact-loading" class="py-12 flex flex-col items-center justify-center gap-3 hidden">
        <div class="w-5 h-5 rounded-full border-2 border-slate-300 border-t-sky-600 animate-spin"></div>
        <p id="compact-loading-text" class="text-xs text-slate-400 tracking-wider">ライナーノーツを生成中...</p>
      </div>

      <div id="compact-placeholder" class="py-12 text-center text-xs text-slate-400">
        Apple Music等から共有するか、「ライナーノーツ開始」を押すと解説が始まります。
      </div>

      <div id="compact-content" class="hidden space-y-6">
        <div id="compact-markdown" class="prose-music text-[#1f1f1f] dark:text-[#e3e3e3] leading-relaxed font-normal"></div>
        <div id="compact-qa-history" class="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-800 hidden"></div>
      </div>
    </div>

    <div id="compact-qa-box" class="pt-2">
      <div class="flex flex-wrap gap-1.5 mb-2.5">
        <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="アーティストの経歴や音楽的ルーツ、バイオグラフィを教えて">👤 プロフィール</button>
        <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="この楽曲のコード進行やアレンジの特徴を教えて">🎼 コード進行</button>
        <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="この演奏・録音ならではの聴きどころは？">🎻 演奏の聴きどころ</button>
        <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="参加ミュージシャンや録音エピソードを教えて">🎙 制作裏話</button>
      </div>
      <form id="compact-qa-form" class="flex items-center gap-2">
        <input type="text" id="compact-qa-input" placeholder="曲やアルバムについてGeminiに質問..." class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-sky-500 shadow-sm">
        <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition">質問</button>
      </form>
    </div>
  </main>

  <!-- 標準表示 -->
  <main id="standard-view" class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <div class="lg:col-span-5 flex flex-col gap-4">
      <div class="rounded-2xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-800 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <span id="source-app-name" class="text-xs font-mono text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            待機中
          </span>
          <div class="flex items-center gap-2">
            <span id="standard-mode-badge" class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200/80 dark:border-indigo-800 hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
              アルバムモード
            </span>
            <span id="standard-session-badge" class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full font-medium bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200/80 dark:border-emerald-800 hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              自動追従中
            </span>
          </div>
        </div>

        <div class="flex items-center justify-center my-3">
          <div class="relative w-44 h-44 bg-slate-50 dark:bg-slate-850 border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-center shadow-sm overflow-hidden">
            <img id="artwork-img" src="" alt="Album Artwork" referrerpolicy="no-referrer" class="w-full h-full object-cover hidden">
            <div id="artwork-fallback" class="flex flex-col items-center p-3 text-center">
              <i data-lucide="disc-3" class="h-12 w-12 text-slate-400 mb-1 opacity-30"></i>
              <span id="album-display" class="text-xs text-slate-400 line-clamp-2 font-mono">待機中</span>
            </div>
          </div>
        </div>

        <div class="text-center mt-3">
          <h2 id="track-title" class="text-base font-bold text-[#1f1f1f] dark:text-white line-clamp-1 tracking-tight">再生・共有を待機中</h2>
          <p id="track-artist" class="text-xs text-slate-600 dark:text-slate-300 font-medium mt-1 line-clamp-1"></p>
          <p id="track-album-sub" class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 line-clamp-1 hidden font-mono"></p>
        </div>

        <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-750 flex flex-col gap-3">
          <div class="flex items-center justify-center gap-5">
            <button id="btn-prev-track" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-750 text-slate-600 dark:text-slate-300 transition"><i data-lucide="skip-back" class="h-4 w-4"></i></button>
            <button id="btn-play-pause" class="w-10 h-10 rounded-xl bg-sky-600 hover:bg-sky-700 text-white flex items-center justify-center shadow-sm transition">
              <i id="icon-play-pause" data-lucide="play" class="h-4 w-4 fill-current ml-0.5"></i>
            </button>
            <button id="btn-next-track" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-750 text-slate-600 dark:text-slate-300 transition"><i data-lucide="skip-forward" class="h-4 w-4"></i></button>
          </div>
          <div class="flex items-center gap-2 px-2 mt-1">
            <i data-lucide="volume-2" class="h-3.5 w-3.5 text-slate-400"></i>
            <input type="range" id="volume-slider" min="0" max="100" value="50" class="w-full h-1 bg-slate-200 dark:bg-slate-700 rounded appearance-none accent-sky-600">
            <span id="volume-label" class="text-[11px] font-mono w-7 text-right text-slate-400">50%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="rounded-2xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-800 p-6 shadow-sm min-h-[480px] flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between pb-3.5 border-b border-slate-100 dark:border-slate-750 mb-5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold flex items-center gap-1.5 text-slate-800 dark:text-slate-200">
                <i data-lucide="sparkles" class="h-3.5 w-3.5 text-sky-600"></i>
                ライナーノーツ
              </span>
              <span id="analysis-status-text" class="text-[11px] font-mono text-slate-400">停止中</span>
            </div>

            <div class="flex items-center gap-2">
              <button id="btn-copy-notes" class="px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-750 border border-slate-200/80 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 transition flex items-center gap-1 hidden shadow-sm">
                <i data-lucide="share-2" class="h-3.5 w-3.5"></i>
                <span id="btn-copy-notes-text">解説を共有</span>
              </button>

              <button id="btn-start-session" class="px-3.5 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
                <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
                <span>ライナーノーツ開始</span>
              </button>
              <button id="btn-stop-session" class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-750 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 text-xs font-semibold shadow-sm transition hidden flex items-center gap-1.5">
                <i data-lucide="square" class="h-3 w-3 fill-current"></i>
                <span>これでおしまい</span>
              </button>
            </div>
          </div>

          <div id="ai-loading" class="py-16 flex flex-col items-center justify-center gap-3 hidden">
            <div class="w-5 h-5 rounded-full border-2 border-slate-300 border-t-sky-600 animate-spin"></div>
            <p id="standard-loading-text" class="text-xs text-slate-400 tracking-wider">ライナーノーツを生成中...</p>
          </div>

          <div id="ai-placeholder" class="py-8 px-4 flex flex-col items-center justify-center text-center">
            <div class="w-11 h-11 rounded-2xl bg-sky-50 dark:bg-sky-950/50 border border-sky-100 dark:border-sky-900 flex items-center justify-center text-sky-600 dark:text-sky-400 mb-3 shadow-xs">
              <i data-lucide="book-open" class="h-5 w-5"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 tracking-tight">AI 音楽ライナーノーツ</h3>
            <p class="text-xs text-slate-400 dark:text-slate-500 max-w-sm mt-1.5 leading-relaxed">
              Apple MusicやSpotifyから共有するか、「ライナーノーツ開始」を押すと本格的な解説が始まります。
            </p>
          </div>

          <div id="ai-content-body" class="space-y-4 hidden">
            <div id="markdown-output" class="prose-music text-[#1f1f1f] dark:text-[#e3e3e3] leading-relaxed font-normal"></div>
            <div id="standard-qa-history" class="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-750 hidden"></div>
          </div>
        </div>

        <div id="standard-qa-box" class="pt-4 border-t border-slate-100 dark:border-slate-750 mt-6">
          <div class="flex flex-wrap gap-1.5 mb-2.5">
            <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="アーティストの経歴や音楽的ルーツ、バイオグラフィを教えて">👤 プロフィール</button>
            <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="この楽曲のコード進行やアレンジの特徴を教えて">🎼 コード進行</button>
            <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="この演奏・録音ならではの聴きどころは？">🎻 演奏の聴きどころ</button>
            <button class="qa-quick-chip px-2.5 py-1 rounded-full bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 text-[11px] text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 transition" data-q="参加ミュージシャンや録音エピソードを教えて">🎙 制作裏話</button>
          </div>
          <form id="standard-qa-form" class="flex items-center gap-2">
            <input type="text" id="standard-qa-input" placeholder="曲やアルバムについてGeminiに何でも質問..." class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-sky-500 shadow-sm">
            <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition">送信</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- 設定モーダル -->
  <div id="api-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">Gemini API 設定</h3>
        <button id="btn-close-api-modal" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-3.5 py-2 text-xs mb-4 focus:outline-none focus:border-sky-500">
      <div class="flex justify-end">
        <button id="btn-save-api-key" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold shadow-sm transition">保存</button>
      </div>
    </div>
  </div>

  <script>
    // 確実に動作するテキスト生成用モデルの優先リスト（特殊モデル・プレビュー専用は除外）
    const PRIMARY_MODELS = [
      'gemini-2.0-flash',

    function jsonpFetch(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}callback=${callbackName}`;
        
        const cleanup = () => {
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        };

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error('JSONP request failed'));
        };
        document.body.appendChild(script);
      });
    }

    async function parseAppleMusicOrText(rawText, rawTitle, rawUrl) {
      const fullText = `${rawTitle || ''} ${rawText || ''}`.trim();
      const extractedUrl = (rawUrl || fullText.match(/https?:\/\/[^\s]+/i)?.[0] || '').trim();

      let textOnly = fullText.replace(/https?:\/\/[^\s]+/gi, '').trim();
      let title = '';
      let artist = '';
      let album = '';
      let artworkUrl = '';

      const quoteMatch = textOnly.match(/[「"『](.+?)[」"』]/);
      if (quoteMatch) {
        title = quoteMatch[1].trim();
        let rest = textOnly.replace(quoteMatch[0], '').trim();
        rest = rest.replace(/^(by|の)\s*/i, '').replace(/\s*(by|の)$/i, '').trim();
        artist = rest;
      } else if (/\bby\b/i.test(textOnly)) {
        const parts = textOnly.split(/\bby\b/i);
        title = parts[0].trim();
        artist = parts.slice(1).join(' by ').trim();
      } else if (textOnly.includes(' - ')) {
        const parts = textOnly.split(' - ');
        title = parts[0].trim();
        artist = parts.slice(1).join(' - ').trim();
      } else if (textOnly.includes(' / ')) {
        const parts = textOnly.split(' / ');
        title = parts[0].trim();
        artist = parts.slice(1).join(' / ').trim();
      } else {
        title = textOnly;
      }

      if (extractedUrl && (extractedUrl.includes('music.apple.com') || extractedUrl.includes('itunes.apple.com'))) {
        try {
          const trackIdMatch = extractedUrl.match(/[?&]i=(\d+)/) || extractedUrl.match(/\/song\/(?:[^/]+\/)?(\d+)/) || extractedUrl.match(/\/album\/(?:[^/]+\/)?(\d+)/);
          const lookupId = trackIdMatch ? trackIdMatch[1] : '';

          if (lookupId) {
            const itunesData = await jsonpFetch(`https://itunes.apple.com/lookup?id=${lookupId}&country=JP`);
            if (itunesData && itunesData.resultCount > 0) {
              const item = itunesData.results[0];
              title = item.trackName || item.collectionName || title;
              artist = item.artistName || artist;
              album = item.collectionName || album;
              if (item.artworkUrl100) {
                artworkUrl = item.artworkUrl100.replace('100x100bb', '600x600bb');
              }
            }
          }
        } catch (e) {
          console.warn('iTunes Lookup failed:', e);
        }

        if (!title || !artist) {
          const slugMatch = extractedUrl.match(/\/album\/([^/]+)\/|\/song\/([^/]+)\//);
          if (slugMatch) {
            const rawSlug = decodeURIComponent(slugMatch[1] || slugMatch[2] || '');
            const readable = rawSlug.replace(/[-_]/g, ' ').trim();
            if (!title) title = readable;
          }
        }
      }

      title = (title || '').replace(/^["'『「]+|["'』」]+$/g, '').trim();
      artist = (artist || '').replace(/^["'『「]+|["'』」]+$/g, '').trim();

      if (!title && extractedUrl) {
        title = extractedUrl;
      }

      return { title, artist, album, artworkUrl, raw: fullText, url: extractedUrl };
    }

    async function checkIncomingShare() {

          handleIncomingTrack({

          renderArtwork(`/api/artwork?seq=${data.artwork_seq}&t=${Date.now()}`);

    // 利用可能モデルのリストを作成（既知の動くモデルを先頭にし、特殊モデルを除外）
    function getCandidateModels() {
      if (state.workingModel) {
        return [state.workingModel, ...PRIMARY_MODELS.filter(m => m !== state.workingModel)];
      }
      return [...PRIMARY_MODELS];

    // 安定稼働モデルへの自動フォールバック関数
    async function callGeminiWithFallback(apiKey, bodyObj) {
      const candidateModels = getCandidateModels();
      let lastError = null;

      for (const model of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyObj)
          });

          if (res.ok) {
            const data = await res.json();
            const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (resultText) {
              state.workingModel = model; // 成功したモデルをキャッシュして次回から最速実行
              return resultText;
            }
          }

          const errJson = await res.json().catch(() => ({}));
          const errMsg = errJson.error?.message || `HTTP ${res.status}`;
          lastError = new Error(`[${model}] ${errMsg}`);

          // APIキー自体が無効な場合（認証不合格）のみ即時終了
          if (res.status === 401 || errMsg.includes('API_KEY_INVALID') || errMsg.includes('key not valid')) {
            throw lastError;
          }

          // それ以外の全エラー（特殊モデル非対応、モデル不在、パラメータ相違など）は次のモデルへ切り替えて試行
          console.warn(`Model ${model} failed (${errMsg}). Trying next model...`);
          continue;

        } catch (e) {
          lastError = e;
          if (e.message && (e.message.includes('API_KEY_INVALID') || e.message.includes('key not valid'))) {
            throw e;
          }
          continue;
        }
      }

      throw lastError || new Error('利用可能なGeminiモデルが見つかりませんでした。APIキーをご確認ください。');
    }

    async function triggerGeminiAnalysis(targetGenId) {
      if (!state.currentTrack.title || state.isAnalyzing) return;
      const apiKey = state.apiKey.trim();
      if (!apiKey) {
        elAiPlaceholder.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        elCompactPlaceholder.classList.add('hidden');
        elCompactContent.classList.remove('hidden');
        const errHtml = '<div class="p-3 rounded-lg bg-amber-50 text-amber-700 text-xs">左上のアイコンから Gemini API キーを設定してください。</div>';
        elMarkdownOutput.innerHTML = errHtml;
        elCompactMarkdown.innerHTML = errHtml;
        return;
      }

      state.isAnalyzing = true;
      elAiPlaceholder.classList.add('hidden');
      elCompactPlaceholder.classList.add('hidden');
      elAiContentBody.classList.add('hidden');
      elCompactContent.classList.add('hidden');
      elAiLoading.classList.remove('hidden');
      elCompactLoading.classList.remove('hidden');
      elBtnCopyNotes.classList.add('hidden');
      elCompactBtnCopyNotes.classList.add('hidden');

      elAnalysisStatusText.textContent = '解析中...';
      elCompactLoadingText.textContent = 'ライナーノーツを生成中...';
      elStandardLoadingText.textContent = '解説を生成中...';

      const artist = state.currentTrack.parsedArtist;
      const album = state.currentTrack.parsedAlbum;
      const prompt = `現在再生中の以下の楽曲について、本格的な音楽ライナーノーツを作成してください。
曲名: ${state.currentTrack.title}
アーティスト: ${artist}
アルバム: ${album || 'シングル / 不明'}

絶対厳守の執筆ルール:
1. 【前置き・挨拶の完全禁止】
   前置き文は1文字も書かず、1行目からいきなり「### アーティストと楽曲の背景」で開始してください。
2. 【見出しと構成（空行の徹底）】
   必ず以下の3つの見出しを使用し、各パートをしっかり詳しく記述してください。
   各見出し（###）の直前と直後には必ず空行を1行空けてください：

   ### アーティストと楽曲の背景

   ### 演奏・アンサンブルの特徴

   ### 聴きどころと位置づけ

3. 【事実の正確性とクレジットの徹底】
   - 作詞・作曲・編曲者、リリース年、参加ミュージシャンなどの固有名詞を正確に記述してください。
   - アーティストの出自・音楽的ルーツや特徴を詳しく紹介してください。
4. 【太字強調のルール】
   - アーティスト名、重要人名、年代表記、コード進行、キーとなる音楽用語は太字（**単語**）で強調してください。`;

      try {
        const bodyObj = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { 
            maxOutputTokens: 4096
          }
        };

        const text = await callGeminiWithFallback(apiKey, bodyObj);

        if (targetGenId !== state.trackGenerationId) return;

        state.latestInsightText = text;

        const cleanHtml = renderCleanMarkdown(text);
        elMarkdownOutput.innerHTML = cleanHtml;
        elCompactMarkdown.innerHTML = cleanHtml;

        elAiLoading.classList.add('hidden');
        elCompactLoading.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        elCompactContent.classList.remove('hidden');
        elBtnCopyNotes.classList.remove('hidden');
        elCompactBtnCopyNotes.classList.remove('hidden');
        elAnalysisStatusText.textContent = '完了';

      } catch (err) {
        if (targetGenId !== state.trackGenerationId) return;
        const errHtml = `<div class="p-3 rounded-lg bg-rose-50 text-rose-600 text-xs font-mono">生成エラー: ${err.message}</div>`;
        elMarkdownOutput.innerHTML = errHtml;
        elCompactMarkdown.innerHTML = errHtml;
        elAiLoading.classList.add('hidden');
        elCompactLoading.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        elCompactContent.classList.remove('hidden');
        elAnalysisStatusText.textContent = 'エラー';
      } finally {
        if (targetGenId === state.trackGenerationId) {
          state.isAnalyzing = false;
        }
      }
    }

    async function askGeminiQuestion(q) {
      if (!q || !q.trim() || !state.apiKey) return;
      const question = q.trim();

      elAiPlaceholder.classList.add('hidden');
      elCompactPlaceholder.classList.add('hidden');
      elAiContentBody.classList.remove('hidden');
      elCompactContent.classList.remove('hidden');

      state.chatHistory.push({ role: 'user', text: question });
      renderQaHistory();

      const loadingId = 'loading-' + Date.now();
      state.chatHistory.push({ role: 'model', text: '...', id: loadingId, isLoading: true });
      renderQaHistory();

      const prompt = `曲名: ${state.currentTrack.title}\nアーティスト: ${state.currentTrack.parsedArtist}\n質問: ${question}\n前置きを省き、要点を分かりやすく回答してください。`;

      try {
        const bodyObj = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 2048 }
        };

        const answer = await callGeminiWithFallback(state.apiKey, bodyObj);
        const idx = state.chatHistory.findIndex(i => i.id === loadingId);
        if (idx !== -1) state.chatHistory[idx] = { role: 'model', text: answer, rawMarkdown: answer, questionContext: question };
      } catch (err) {
        const idx = state.chatHistory.findIndex(i => i.id === loadingId);
        if (idx !== -1) state.chatHistory[idx] = { role: 'model', text: `エラー: ${err.message}` };
      } finally {
        renderQaHistory();
      }
    }

    function renderQaHistory() {
      const render = (container) => {
        if (!container) return;
        if (state.chatHistory.length === 0) {
          container.classList.add('hidden');
          container.innerHTML = '';
          return;
        }
        container.classList.remove('hidden');
        container.innerHTML = state.chatHistory.map((item, index) => {
          if (item.role === 'user') {
            return `<div class="flex justify-end"><div class="bg-sky-600 text-white rounded-xl px-3.5 py-2 text-xs max-w-[85%] shadow-sm">${item.text}</div></div>`;
          } else {
            return `
              <div class="flex flex-col items-start gap-1.5 max-w-[90%]">
                <div class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-xs leading-relaxed shadow-sm border border-slate-200/80 dark:border-slate-700/80 prose-music">
                  ${item.isLoading ? '<span class="inline-flex items-center gap-1.5 text-slate-400"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>思考中...</span>' : renderCleanMarkdown(item.text)}
                </div>
              </div>
            `;
          }
        }).join('');
      };
      render(elStandardQaHistory);
      render(elCompactQaHistory);
      safeCreateIcons();
    }

    document.querySelectorAll('.qa-quick-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        askGeminiQuestion(btn.getAttribute('data-q'));
      });
    });

    elStandardQaForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (elStandardQaInput.value.trim()) {
        askGeminiQuestion(elStandardQaInput.value);
        elStandardQaInput.value = '';
      }
    });

    elCompactQaForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (elCompactQaInput.value.trim()) {
        askGeminiQuestion(elCompactQaInput.value);
        elCompactQaInput.value = '';
      }
    });

    if (elBtnBrandSettings) {
      elBtnBrandSettings.addEventListener('click', () => {
        elInputApiKey.value = state.apiKey;
        elApiModal.classList.remove('hidden');
      });
    }
    elBtnCloseApiModal.addEventListener('click', () => elApiModal.classList.add('hidden'));
    elBtnSaveApiKey.addEventListener('click', () => {
      state.apiKey = elInputApiKey.value.trim();
      state.workingModel = null;
      localStorage.setItem('gemini_api_key', state.apiKey);
      elApiModal.classList.add('hidden');
      updateApiKeyStatus();
      if (state.currentTrack.title) {
        startSession();
      }
    });

    function updateApiKeyStatus() {
      if (state.apiKey) elApiKeyDot.classList.add('hidden');
      else elApiKeyDot.classList.remove('hidden');
    }

    applyViewMode();
    updateApiKeyStatus();
    checkIncomingShare();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
