<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing AI Companion</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: 'Google Sans Text', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 枠や囲みを完全に排除し、画面幅に合わせて自然にリフローするエディトリアルタイポグラフィ */
    .prose-music h3 {
      border-left: 4px solid #0284c7;
      padding-left: 0.65rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: #0f172a;
      margin-top: 2.2rem;
      margin-bottom: 0.15rem;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }
    .prose-music h3:first-child {
      margin-top: 0.5rem;
    }
    .dark .prose-music h3 {
      color: #f1f5f9;
      border-left-color: #38bdf8;
    }

    /* サブセクション（1. 2. 3. などの小見出し）：前には空行、本文との間には空行を挟まない */
    .prose-music h4, .prose-music .sub-heading {
      font-weight: 700;
      font-size: 1.05rem;
      color: #0f172a;
      margin-top: 1.6rem;
      margin-bottom: 0.15rem;
      line-height: 1.4;
      display: block;
    }
    .dark .prose-music h4, .dark .prose-music .sub-heading {
      color: #f1f5f9;
    }

    /* 本文：見出し直下から空行なしで開始し、頭に全角1文字分の空白（インデント）を配置 */
    .prose-music p {
      color: #1e293b;
      font-size: 1.05rem;
      line-height: 1.85;
      margin-top: 0;
      margin-bottom: 1rem;
      text-indent: 1em;
      letter-spacing: 0.01em;
      word-break: break-word;
    }
    .dark .prose-music p {
      color: #cbd5e1;
    }

    .prose-music strong, .prose-music b {
      font-weight: 700;
      color: inherit;
    }
    .dark .prose-music strong, .dark .prose-music b {
      color: inherit;
    }

    /* 番号付きリストやサブセクション項目の余白確保 */
    .prose-music ol {
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      padding-left: 0;
      list-style-position: inside;
    }
    .prose-music ol > li {
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      line-height: 1.85;
    }
    .prose-music ol > li:first-child {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col selection:bg-sky-500/20">

  <!-- ヘッダー：幅制限を撤廃し、画面幅100%に自然に展開 -->
  <header class="w-full px-3 sm:px-6 py-2.5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 bg-white/95 dark:bg-slate-900/95 sticky top-0 z-40 backdrop-blur">
    <div id="btn-brand-settings" class="flex items-center gap-2 cursor-pointer select-none group shrink-0" title="Gemini API設定">
      <div class="h-6 w-6 rounded bg-sky-600 flex items-center justify-center text-white group-hover:bg-sky-500 transition">
        <i data-lucide="music-2" class="h-3.5 w-3.5"></i>
      </div>
      <span class="font-bold text-xs tracking-tight">Now Playing</span>
      <span id="api-key-indicator-dot" class="w-1.5 h-1.5 rounded-full bg-amber-500 hidden" title="APIキー未設定"></span>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <button id="btn-copy-track-header" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition whitespace-nowrap" title="曲情報を共有またはコピー">
        <i data-lucide="share-2" class="h-3.5 w-3.5"></i>
        <span id="btn-copy-track-text">曲情報</span>
      </button>

      <button id="btn-copy-notes-header" class="hidden flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium transition whitespace-nowrap" title="解説文を共有またはコピー">
        <i data-lucide="copy" class="h-3.5 w-3.5"></i>
        <span id="btn-copy-notes-text">解説を共有</span>
      </button>

      <button id="btn-start-session" class="px-3.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
        <span>ライナーノーツ開始</span>
      </button>
      <button id="btn-stop-session" class="px-3.5 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-100 text-xs font-semibold transition hidden flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="square" class="h-3 w-3 fill-current"></i>
        <span>これでおしまい</span>
      </button>
    </div>
  </header>

  <!-- 受信ステータスバナー -->
  <div id="share-debug-banner" class="hidden w-full bg-sky-50 dark:bg-sky-950/60 px-4 py-2 text-xs text-sky-700 dark:text-sky-300 flex items-center justify-between">
    <span id="share-debug-text" class="truncate">共有データを受信しました</span>
    <button onclick="this.parentElement.classList.add('hidden')" class="ml-2 text-sky-500 hover:text-sky-700">✕</button>
  </div>

  <!-- メイン領域：カードやボックスの囲みを一切廃止し、ウィンドウ全幅100%を活用 -->
  <main class="w-full flex-1 px-3 sm:px-8 py-5 flex flex-col gap-6">

    <!-- 楽曲メタ情報：四角いカードで囲わず、自然なドキュメントヘッダーとして展開 -->
    <section class="w-full flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 pb-5 border-b border-slate-100 dark:border-slate-800/80">
      
      <!-- アートワーク：余計な背景枠やドロップシャドウを排除 -->
      <div class="w-28 h-28 sm:w-36 sm:h-36 shrink-0 flex items-center justify-center overflow-hidden">
        <img id="artwork-img" src="" alt="Album Artwork" referrerpolicy="no-referrer" class="w-full h-full object-cover hidden">
        <div id="artwork-fallback" class="w-full h-full flex flex-col items-center justify-center text-slate-300 dark:text-slate-600 border border-slate-100 dark:border-slate-800">
          <i data-lucide="disc-3" class="h-10 w-10 mb-1 opacity-50"></i>
          <span class="text-[10px] font-mono">No Image</span>
        </div>
      </div>

      <!-- タイトル・アーティスト・ステータス -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
          <span id="source-app-name" class="text-xs font-mono text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            待機中
          </span>
          <span id="session-badge" class="text-[10px] px-2 py-0.5 rounded font-medium bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 hidden">
            自動追従中
          </span>
          <span id="analysis-status-text" class="text-[10px] font-mono text-slate-400">停止中</span>
        </div>

        <h1 id="track-title" class="text-xl sm:text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white leading-snug break-words">
          再生・共有を待機中
        </h1>
        <p id="track-artist" class="text-sm sm:text-base font-medium text-slate-600 dark:text-slate-300 mt-1 break-words">
          音楽アプリから曲を共有するか、PCで再生を開始してください
        </p>
        <p id="track-album" class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 break-words hidden"></p>

        <!-- プレイヤーコントロール：スリムなインライン配置 -->
        <div class="mt-3 flex items-center gap-4 flex-wrap">
          <div class="flex items-center gap-2">
            <button id="btn-prev-track" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition"><i data-lucide="skip-back" class="h-4 w-4"></i></button>
            <button id="btn-play-pause" class="w-8 h-8 rounded-full bg-sky-600 hover:bg-sky-700 text-white flex items-center justify-center transition">
              <i id="icon-play-pause" data-lucide="play" class="h-3.5 w-3.5 fill-current ml-0.5"></i>
            </button>
            <button id="btn-next-track" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition"><i data-lucide="skip-forward" class="h-4 w-4"></i></button>
          </div>
          <div class="flex items-center gap-2 w-32">
            <i data-lucide="volume-2" class="h-3 w-3 text-slate-400"></i>
            <input type="range" id="volume-slider" min="0" max="100" value="50" class="w-full h-1 bg-slate-200 dark:bg-slate-700 rounded appearance-none accent-sky-600">
          </div>
        </div>
      </div>
    </section>

    <!-- ライナーノーツ本文：枠や箱を完全に排し、画面全幅で自由にリフローする空間 -->
    <article class="w-full flex-1">
      
      <!-- ローディング表示 -->
      <div id="ai-loading" class="py-16 flex flex-col items-center justify-center gap-3 hidden">
        <div class="w-6 h-6 rounded-full border-2 border-slate-200 border-t-sky-600 animate-spin"></div>
        <p id="loading-text" class="text-xs text-slate-400 tracking-wider">ライナーノーツを生成中...</p>
      </div>

      <!-- プレースホルダー（未開始時） -->
      <div id="ai-placeholder" class="py-16 text-center text-slate-400 dark:text-slate-500 text-sm">
        Apple Music等から曲を共有するか、「ライナーノーツ開始」を押すと本格的な解説が始まります。
      </div>

      <!-- 本文出力先：一切の境界線・囲み枠なし -->
      <div id="ai-content-body" class="w-full hidden space-y-6">
        <div id="markdown-output" class="prose-music w-full"></div>
        <div id="qa-history" class="w-full space-y-4 pt-6 border-t border-slate-100 dark:border-slate-800/80 hidden"></div>
      </div>
    </article>

    <!-- 質問操作部：画面下部に自然に配置（箱で囲わない） -->
    <footer class="w-full pt-4 pb-6">
      <div class="flex flex-wrap gap-1.5 mb-2.5">
        <button class="qa-quick-chip px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 transition whitespace-nowrap" data-q="アーティストの経歴や音楽的ルーツ、バイオグラフィを教えて">👤 プロフィール</button>
        <button class="qa-quick-chip px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 transition whitespace-nowrap" data-q="この楽曲のコード進行やアレンジの特徴を教えて">🎼 コード進行</button>
        <button class="qa-quick-chip px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 transition whitespace-nowrap" data-q="この演奏・録音ならではの聴きどころは？">🎻 演奏の聴きどころ</button>
        <button class="qa-quick-chip px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 transition whitespace-nowrap" data-q="参加ミュージシャンや録音エピソードを教えて">🎙 制作裏話</button>
      </div>

      <form id="qa-form" class="w-full flex items-center gap-2">
        <input type="text" id="qa-input" placeholder="曲やアルバムについてGeminiに質問..." class="flex-1 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-sky-500">
        <button type="submit" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold transition shrink-0 whitespace-nowrap">送信</button>
      </form>
    </footer>
  </main>

  <!-- 設定モーダル -->
  <div id="api-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">Gemini API 設定</h3>
        <button id="btn-close-api-modal" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="h-4 w-4"></i></button>
      </div>
      <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3.5 py-2 text-xs mb-4 focus:outline-none focus:border-sky-500">
      <div class="flex justify-end">
        <button id="btn-save-api-key" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold transition">保存</button>
      </div>
    </div>
  </div>

  <script>
    // ユーザー指定の最新 gemini-3.8-flash を最優先に設定
    const PRIMARY_MODELS = [
      'gemini-3.8-flash',
      'gemini-3.5-flash-lite',
      'gemini-2.5-flash'
    ];

    const state = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      currentTrack: { 
        title: '', 
        artist: '', 
        album: '', 
        parsedArtist: '', 
        parsedAlbum: '', 
        app: '', 
        playing: false, 
        hasArtwork: false, 
        artworkUrl: '',
        artworkSeq: 0 
      },
      isAnalyzing: false,
      latestInsightText: '',
      chatHistory: [],
      trackGenerationId: 0,
      isSessionActive: false,
      workingModel: null
    };

    // DOM 要素参照
    const elArtworkImg = document.getElementById('artwork-img');
    const elArtworkFallback = document.getElementById('artwork-fallback');
    const elTrackTitle = document.getElementById('track-title');
    const elTrackArtist = document.getElementById('track-artist');
    const elTrackAlbum = document.getElementById('track-album');
    const elSourceAppName = document.getElementById('source-app-name');
    const elSessionBadge = document.getElementById('session-badge');
    const elAnalysisStatusText = document.getElementById('analysis-status-text');

    const elAiPlaceholder = document.getElementById('ai-placeholder');
    const elAiLoading = document.getElementById('ai-loading');
    const elLoadingText = document.getElementById('loading-text');
    const elAiContentBody = document.getElementById('ai-content-body');
    const elMarkdownOutput = document.getElementById('markdown-output');
    const elQaHistory = document.getElementById('qa-history');
    const elQaForm = document.getElementById('qa-form');
    const elQaInput = document.getElementById('qa-input');

    const elBtnStartSession = document.getElementById('btn-start-session');
    const elBtnStopSession = document.getElementById('btn-stop-session');
    const elBtnCopyTrackHeader = document.getElementById('btn-copy-track-header');
    const elBtnCopyTrackText = document.getElementById('btn-copy-track-text');
    const elBtnCopyNotesHeader = document.getElementById('btn-copy-notes-header');
    const elBtnCopyNotesText = document.getElementById('btn-copy-notes-text');

    const elBtnPrev = document.getElementById('btn-prev-track');
    const elBtnPlayPause = document.getElementById('btn-play-pause');
    const elIconPlayPause = document.getElementById('icon-play-pause');
    const elBtnNext = document.getElementById('btn-next-track');
    const elVolumeSlider = document.getElementById('volume-slider');

    const elShareDebugBanner = document.getElementById('share-debug-banner');
    const elShareDebugText = document.getElementById('share-debug-text');

    const elApiModal = document.getElementById('api-modal');
    const elBtnBrandSettings = document.getElementById('btn-brand-settings');
    const elBtnCloseApiModal = document.getElementById('btn-close-api-modal');
    const elBtnSaveApiKey = document.getElementById('btn-save-api-key');
    const elInputApiKey = document.getElementById('input-api-key');
    const elApiKeyDot = document.getElementById('api-key-indicator-dot');

    function safeCreateIcons() { try { lucide.createIcons(); } catch(e) {} }

    function renderCleanMarkdown(rawMarkdown) {
      if (!rawMarkdown) return '';
      let text = rawMarkdown;

      // 「1. 見出し」「2. 見出し」等のサブセクション行を自動検出し、太字小見出し(h4)化（見出し直後の空行は排除）
      text = text.replace(/(?:^|\n)(\d+\.\s+[^\n:：]+)(?:\n+)/g, '\n\n#### $1\n');

      // 太字タグの正規化
      text = text.replace(/\*\*\s*([^\*\n]+?)\s*\*\*/g, '<strong>$1</strong>');

      let html = marked.parse(text);
      return html.replace(/\*\*/g, '');
    }

    function formatMarkdownForClipboard(rawText) {
      if (!rawText) return '';
      let text = rawText.trim();
      text = text.replace(/([^\n])\n(#{1,6}\s+[^\n]+)/g, '$1\n\n$2');
      text = text.replace(/(#{1,6}\s+[^\n]+)\n([^\n#])/g, '$1\n\n$2');
      text = text.replace(/\n{3,}/g, '\n\n');
      return text;
    }

    function updateSessionUI() {
      if (state.isSessionActive) {
        elBtnStartSession.classList.add('hidden');
        elBtnStopSession.classList.remove('hidden');
        elSessionBadge.classList.remove('hidden');
      } else {
        elBtnStartSession.classList.remove('hidden');
        elBtnStopSession.classList.add('hidden');
        elSessionBadge.classList.add('hidden');
        elAnalysisStatusText.textContent = '停止中';
      }
      safeCreateIcons();
    }

    function renderArtwork(src) {
      if (src) {
        elArtworkImg.onload = () => {
          elArtworkImg.classList.remove('hidden');
          elArtworkFallback.classList.add('hidden');
        };
        elArtworkImg.src = src;
      } else {
        elArtworkImg.classList.add('hidden');
        elArtworkFallback.classList.remove('hidden');
      }
    }
    elArtworkImg.onerror = () => {
      elArtworkImg.classList.add('hidden');
      elArtworkFallback.classList.remove('hidden');
    };

    async function shareOrCopyText({ title, text, textElement, originalLabel }) {
      if (!text) return;
      if (navigator.share) {
        try {
          await navigator.share({ title: title || 'Now Playing', text: text });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        if (textElement) {
          textElement.textContent = '完了!';
          setTimeout(() => { textElement.textContent = originalLabel; }, 1500);
        }
      } catch (err) {}
    }

    elBtnCopyTrackHeader.addEventListener('click', async () => {
      if (!state.currentTrack.title) return;
      const title = state.currentTrack.title;
      const artist = state.currentTrack.parsedArtist || state.currentTrack.artist;
      const album = state.currentTrack.parsedAlbum || state.currentTrack.album;
      const formatted = album ? `${title} / ${artist} - 『${album}』` : `${title} / ${artist}`;

      await shareOrCopyText({
        title: `${title} - ${artist}`,
        text: formatted,
        textElement: elBtnCopyTrackText,
        originalLabel: '曲情報'
      });
    });

    elBtnCopyNotesHeader.addEventListener('click', async () => {
      if (!state.latestInsightText) return;
      const title = state.currentTrack.title;
      const artist = state.currentTrack.parsedArtist || state.currentTrack.artist;
      const album = state.currentTrack.parsedAlbum || state.currentTrack.album;

      const metaHeader = `## ${title} / ${artist}${album ? ` (アルバム: ${album})` : ''}\n\n`;
      const formattedBody = formatMarkdownForClipboard(state.latestInsightText);
      const fullText = metaHeader + formattedBody;

      await shareOrCopyText({
        title: `ライナーノーツ: ${title} / ${artist}`,
        text: fullText,
        textElement: elBtnCopyNotesText,
        originalLabel: '解説を共有'
      });
    });

    function startSession() {
      state.isSessionActive = true;
      updateSessionUI();
      if (state.currentTrack.title) {
        triggerGeminiAnalysis(state.trackGenerationId);
      }
    }

    function stopSession() {
      state.isSessionActive = false;
      state.isAnalyzing = false;
      state.latestInsightText = '';
      elMarkdownOutput.innerHTML = '';
      elAiContentBody.classList.add('hidden');
      elBtnCopyNotesHeader.classList.add('hidden');
      elAiPlaceholder.classList.remove('hidden');
      state.chatHistory = [];
      renderQaHistory();
      updateSessionUI();
      elAiLoading.classList.add('hidden');
    }

    elBtnStartSession.addEventListener('click', startSession);
    elBtnStopSession.addEventListener('click', stopSession);

    function jsonpFetch(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        const sep = url.includes('?') ? '&' : '?';
        script.src = `${url}${sep}callback=${callbackName}`;
        
        const cleanup = () => {
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
        };

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error('JSONP request failed'));
        };
        document.body.appendChild(script);
      });
    }

    async function parseAppleMusicOrText(rawText, rawTitle, rawUrl) {
      const fullText = `${rawTitle || ''} ${rawText || ''}`.trim();
      const extractedUrl = (rawUrl || fullText.match(/https?:\/\/[^\s]+/i)?.[0] || '').trim();

      let textOnly = fullText.replace(/https?:\/\/[^\s]+/gi, '').trim();
      let title = '';
      let artist = '';
      let album = '';
      let artworkUrl = '';

      const quoteMatch = textOnly.match(/[「"『](.+?)[」"』]/);
      if (quoteMatch) {
        title = quoteMatch[1].trim();
        let rest = textOnly.replace(quoteMatch[0], '').trim();
        rest = rest.replace(/^(by|の)\s*/i, '').replace(/\s*(by|の)$/i, '').trim();
        artist = rest;
      } else if (/\bby\b/i.test(textOnly)) {
        const parts = textOnly.split(/\bby\b/i);
        title = parts[0].trim();
        artist = parts.slice(1).join(' by ').trim();
      } else if (textOnly.includes(' - ')) {
        const parts = textOnly.split(' - ');
        title = parts[0].trim();
        artist = parts.slice(1).join(' - ').trim();
      } else if (textOnly.includes(' / ')) {
        const parts = textOnly.split(' / ');
        title = parts[0].trim();
        artist = parts.slice(1).join(' / ').trim();
      } else {
        title = textOnly;
      }

      if (extractedUrl && (extractedUrl.includes('music.apple.com') || extractedUrl.includes('itunes.apple.com'))) {
        try {
          const trackIdMatch = extractedUrl.match(/[?&]i=(\d+)/) || extractedUrl.match(/\/song\/(?:[^/]+\/)?(\d+)/) || extractedUrl.match(/\/album\/(?:[^/]+\/)?(\d+)/);
          const lookupId = trackIdMatch ? trackIdMatch[1] : '';

          if (lookupId) {
            const itunesData = await jsonpFetch(`https://itunes.apple.com/lookup?id=${lookupId}&country=JP`);
            if (itunesData && itunesData.resultCount > 0) {
              const item = itunesData.results[0];
              title = item.trackName || item.collectionName || title;
              artist = item.artistName || artist;
              album = item.collectionName || album;
              if (item.artworkUrl100) {
                artworkUrl = item.artworkUrl100.replace('100x100bb', '600x600bb');
              }
            }
          }
        } catch (e) {
          console.warn('iTunes Lookup failed:', e);
        }

        if (!title || !artist) {
          const slugMatch = extractedUrl.match(/\/album\/([^/]+)\/|\/song\/([^/]+)\//);
          if (slugMatch) {
            const rawSlug = decodeURIComponent(slugMatch[1] || slugMatch[2] || '');
            const readable = rawSlug.replace(/[-_]/g, ' ').trim();
            if (!title) title = readable;
          }
        }
      }

      title = (title || '').replace(/^["'『「]+|["'』」]+$/g, '').trim();
      artist = (artist || '').replace(/^["'『「]+|["'』」]+$/g, '').trim();

      if (!title && extractedUrl) {
        title = extractedUrl;
      }

      return { title, artist, album, artworkUrl, raw: fullText, url: extractedUrl };
    }

    async function checkIncomingShare() {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedTitle = urlParams.get('title') || '';
      const sharedText = urlParams.get('text') || '';
      const sharedUrl = urlParams.get('url') || '';

      if (sharedTitle || sharedText || sharedUrl) {
        elShareDebugBanner.classList.remove('hidden');
        elShareDebugText.textContent = `共有データ受信中...`;

        const parsed = await parseAppleMusicOrText(sharedText, sharedTitle, sharedUrl);
        
        if (parsed.title) {
          const displayLabel = parsed.artist ? `${parsed.title} / ${parsed.artist}` : parsed.title;
          elShareDebugText.textContent = `認識完了: ${displayLabel}`;
          setTimeout(() => elShareDebugBanner.classList.add('hidden'), 5000);

          handleIncomingTrack({
            title: parsed.title,
            artist: parsed.artist || 'Apple Music',
            album: parsed.album || '',
            artwork_url: parsed.artworkUrl,
            playing: true,
            has_artwork: !!parsed.artworkUrl,
            artwork_seq: 0,
            app: 'Apple Music'
          });

          startSession();
        } else {
          elShareDebugText.textContent = `解析できませんでした: ${parsed.raw}`;
        }
      }
    }

    async function pollSmtcBridge() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('title') || urlParams.get('text') || urlParams.get('url')) return;

      try {
        const res = await fetch('/api/track');
        if (res.ok) {
          const data = await res.json();
          handleIncomingTrack(data);
        }
      } catch (e) {}
    }
    setInterval(pollSmtcBridge, 1000);

    function handleIncomingTrack(data) {
      if (!data) return;

      const trackTitle = (data.title || '').trim();
      const rawArtist = (data.artist || '').trim();
      const rawAlbum = (data.album || '').trim();
      if (!trackTitle) return;

      const trackKey = `${trackTitle}:::${rawArtist}`;

      if (trackKey !== `${state.currentTrack.title}:::${state.currentTrack.artist}`) {
        state.trackGenerationId++;
        const currentGenId = state.trackGenerationId;

        state.currentTrack.title = trackTitle;
        state.currentTrack.artist = rawArtist;
        state.currentTrack.album = rawAlbum;
        state.currentTrack.parsedArtist = rawArtist;
        state.currentTrack.parsedAlbum = rawAlbum;

        elTrackTitle.textContent = trackTitle;
        elTrackArtist.textContent = rawArtist;
        if (rawAlbum) {
          elTrackAlbum.textContent = rawAlbum;
          elTrackAlbum.classList.remove('hidden');
        } else {
          elTrackAlbum.classList.add('hidden');
        }

        if (data.artwork_url) {
          renderArtwork(data.artwork_url);
        } else if (data.has_artwork && data.artwork_seq > 0) {
          renderArtwork(`/api/artwork?seq=${data.artwork_seq}&t=${Date.now()}`);
        } else {
          renderArtwork('');
        }

        if (data.app) {
          elSourceAppName.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${data.app}`;
        }

        state.chatHistory = [];
        renderQaHistory();

        if (state.isSessionActive) {
          triggerGeminiAnalysis(currentGenId);
        }
      }
    }

    function getCandidateModels() {
      if (state.workingModel) {
        return [state.workingModel, ...PRIMARY_MODELS.filter(m => m !== state.workingModel)];
      }
      return [...PRIMARY_MODELS];
    }

    async function callGeminiWithFallback(apiKey, bodyObj) {
      const candidateModels = getCandidateModels();
      let lastError = null;

      for (const model of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyObj)
          });

          if (res.ok) {
            const data = await res.json();
            const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (resultText) {
              state.workingModel = model;
              return resultText;
            }
          }

          const errJson = await res.json().catch(() => ({}));
          const errMsg = errJson.error?.message || `HTTP ${res.status}`;
          lastError = new Error(`[${model}] ${errMsg}`);

          if (res.status === 401 || errMsg.includes('API_KEY_INVALID') || errMsg.includes('key not valid')) {
            throw lastError;
          }

          console.warn(`Model ${model} failed (${errMsg}). Trying next model...`);
          continue;

        } catch (e) {
          lastError = e;
          if (e.message && (e.message.includes('API_KEY_INVALID') || e.message.includes('key not valid'))) {
            throw e;
          }
          continue;
        }
      }

      throw lastError || new Error('利用可能なGeminiモデルが見つかりませんでした。');
    }

    async function triggerGeminiAnalysis(targetGenId) {
      if (!state.currentTrack.title || state.isAnalyzing) return;
      const apiKey = state.apiKey.trim();
      if (!apiKey) {
        elAiPlaceholder.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        const errHtml = '<div class="py-3 text-amber-600 text-xs">左上のアイコンから Gemini API キーを設定してください。</div>';
        elMarkdownOutput.innerHTML = errHtml;
        return;
      }

      state.isAnalyzing = true;
      elAiPlaceholder.classList.add('hidden');
      elAiContentBody.classList.add('hidden');
      elAiLoading.classList.remove('hidden');
      elBtnCopyNotesHeader.classList.add('hidden');

      elAnalysisStatusText.textContent = '解析中...';
      elLoadingText.textContent = 'ライナーノーツを生成中...';

      const artist = state.currentTrack.parsedArtist;
      const album = state.currentTrack.parsedAlbum;
      const prompt = `現在再生中の以下の楽曲について、本格的な音楽ライナーノーツを作成してください。
曲名: ${state.currentTrack.title}
アーティスト: ${artist}
アルバム: ${album || 'シングル / 不明'}

絶対厳守の執筆ルール:
1. 【前置き・挨拶の完全禁止】
   前置き文は1文字も書かず、1行目からいきなり「### アーティストと楽曲の背景」で開始してください。
2. 【見出しと構成】
   必ず以下の3つの見出しを使用し、各パートをしっかり詳しく記述してください。
   ・見出しの前には空行を1行入れてください。
   ・見出しの直後の行から空行を挟まずに本文を開始し、行頭には必ず全角空白（　）を1文字入れてください。

   ### アーティストと楽曲の背景
   　本文...

   ### 演奏・アンサンブルの特徴
   　本文...

   ### 聴きどころと位置づけ
   　本文...

3. 【事実の正確性とクレジットの徹底】
   - 作詞・作曲・編曲者、リリース年、参加ミュージシャンなどの固有名詞を正確に記述してください。
   - アーティストの出自・音楽的ルーツや特徴を詳しく紹介してください。
4. 【太字強調のルール】
   - アーティスト名、重要人名、年代表記、コード進行、キーとなる音楽用語は太字（**単語**）で強調してください。`;

      try {
        const bodyObj = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { 
            maxOutputTokens: 4096
          }
        };

        const text = await callGeminiWithFallback(apiKey, bodyObj);

        if (targetGenId !== state.trackGenerationId) return;

        state.latestInsightText = text;

        const cleanHtml = renderCleanMarkdown(text);
        elMarkdownOutput.innerHTML = cleanHtml;

        elAiLoading.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        elBtnCopyNotesHeader.classList.remove('hidden');
        elAnalysisStatusText.textContent = '完了';

      } catch (err) {
        if (targetGenId !== state.trackGenerationId) return;
        const errHtml = `<div class="py-3 text-rose-600 text-xs font-mono">生成エラー: ${err.message}</div>`;
        elMarkdownOutput.innerHTML = errHtml;
        elAiLoading.classList.add('hidden');
        elAiContentBody.classList.remove('hidden');
        elAnalysisStatusText.textContent = 'エラー';
      } finally {
        if (targetGenId === state.trackGenerationId) {
          state.isAnalyzing = false;
        }
      }
    }

    async function askGeminiQuestion(q) {
      if (!q || !q.trim() || !state.apiKey) return;
      const question = q.trim();

      elAiPlaceholder.classList.add('hidden');
      elAiContentBody.classList.remove('hidden');

      state.chatHistory.push({ role: 'user', text: question });
      renderQaHistory();

      const loadingId = 'loading-' + Date.now();
      state.chatHistory.push({ role: 'model', text: '...', id: loadingId, isLoading: true });
      renderQaHistory();

      const prompt = `曲名: ${state.currentTrack.title}
アーティスト: ${state.currentTrack.parsedArtist}
質問: ${question}

回答ルール:
1. 前置きや挨拶は一切省き、要点を分かりやすく回答してください。
2. 「1. 結成とバンド名の由来」などの番号付きサブセクションを用いる場合は、前の項目との間に空行を1行設けてください。
3. 各見出しの直後の行から空行を入れずに本文を開始し、行頭には必ず全角空白（　）を1文字入れて記述してください。
4. 重要な固有名詞やキーワードは **太字** で強調してください。`;

      try {
        const bodyObj = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 2048 }
        };

        const answer = await callGeminiWithFallback(state.apiKey, bodyObj);
        const idx = state.chatHistory.findIndex(i => i.id === loadingId);
        if (idx !== -1) state.chatHistory[idx] = { role: 'model', text: answer, rawMarkdown: answer, questionContext: question };
      } catch (err) {
        const idx = state.chatHistory.findIndex(i => i.id === loadingId);
        if (idx !== -1) state.chatHistory[idx] = { role: 'model', text: `エラー: ${err.message}` };
      } finally {
        renderQaHistory();
      }
    }

    function renderQaHistory() {
      if (!elQaHistory) return;
      if (state.chatHistory.length === 0) {
        elQaHistory.classList.add('hidden');
        elQaHistory.innerHTML = '';
        return;
      }
      elQaHistory.classList.remove('hidden');
      elQaHistory.innerHTML = state.chatHistory.map((item) => {
        if (item.role === 'user') {
          return `
            <div class="flex justify-end">
              <div class="bg-sky-600 text-white rounded-lg px-3.5 py-2 text-xs max-w-[85%]">
                ${item.text}
              </div>
            </div>
          `;
        } else {
          return `
            <div class="flex flex-col items-start gap-1 max-w-full">
              <div class="w-full text-xs leading-relaxed prose-music">
                ${item.isLoading ? '<span class="inline-flex items-center gap-1.5 text-slate-400"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>思考中...</span>' : renderCleanMarkdown(item.text)}
              </div>
            </div>
          `;
        }
      }).join('');
      safeCreateIcons();
    }

    document.querySelectorAll('.qa-quick-chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        askGeminiQuestion(btn.getAttribute('data-q'));
      });
    });

    elQaForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (elQaInput.value.trim()) {
        askGeminiQuestion(elQaInput.value);
        elQaInput.value = '';
      }
    });

    if (elBtnBrandSettings) {
      elBtnBrandSettings.addEventListener('click', () => {
        elInputApiKey.value = state.apiKey;
        elApiModal.classList.remove('hidden');
      });
    }
    elBtnCloseApiModal.addEventListener('click', () => elApiModal.classList.add('hidden'));
    elBtnSaveApiKey.addEventListener('click', () => {
      state.apiKey = elInputApiKey.value.trim();
      state.workingModel = null;
      localStorage.setItem('gemini_api_key', state.apiKey);
      elApiModal.classList.add('hidden');
      updateApiKeyStatus();
      if (state.currentTrack.title) {
        startSession();
      }
    });

    function updateApiKeyStatus() {
      if (state.apiKey) elApiKeyDot.classList.add('hidden');
      else elApiKeyDot.classList.remove('hidden');
    }

    updateApiKeyStatus();
    checkIncomingShare();
  </script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:') && !location.href.startsWith('blob:')) {
      try {
        const swPath = new URL('./sw.js', window.location.href).href;
        navigator.serviceWorker.register(swPath).catch(err => {
          console.warn('Service Worker registration skipped:', err);
        });
      } catch (e) {
        console.warn('Service Worker setup skipped:', e);
      }
    }
  </script>
